name: Daily Indonesian Translation

on:
  schedule:
    - cron: '0 3 * * *'   # Daily at 3 AM UTC (after trending scores update)
  workflow_dispatch:      # Allow manual triggering

jobs:
  auto-translate-indonesian:
    name: Auto-Translate to Indonesian
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup package manager
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10
          
      # Setup Node.js runtime with caching
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          
      # Get pnpm cache directory for optimization
      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: |
          echo "path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      # Cache pnpm packages to speed up future runs
      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
            
      # Install project dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
        
      # Build TypeScript to JavaScript
      - name: Build project
        run: pnpm build
        
      # Ensure compiled file exists before running
      - name: Verify build
        run: test -f dist/cron/auto-translate-indonesian.js
        
      # Execute auto-translation cron job
      - name: Run auto-translate-indonesian job
        run: node dist/cron/auto-translate-indonesian.js
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_READ_URL: ${{ secrets.DATABASE_READ_URL || secrets.DATABASE_URL }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          # AI provider credentials
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        timeout-minutes: 30  # Conservative timeout for AI translation
