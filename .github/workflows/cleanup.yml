name: Daily Cleanup & Subscription Check

on:
  schedule:
    - cron: '0 0 * * *'   # Daily at midnight UTC
  workflow_dispatch:      # Allow manual triggering

jobs:
  cleanup:
    name: Cleanup Old Data
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Bun runtime
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Cache Bun packages to speed up future runs
      - name: Setup Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # Install project dependencies
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build TypeScript to JavaScript
      - name: Build project
        run: bun run build

      # Ensure compiled file exists before running
      - name: Verify build
        run: test -f dist/cron/cleanup.js

      # Execute cleanup cron job
      - name: Run cleanup job
        run: bun dist/cron/cleanup.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_READ_URL: ${{ secrets.DATABASE_READ_URL || secrets.DATABASE_URL }}
          IMAGEKIT_API_KEY_PRIVATE: ${{ secrets.IMAGEKIT_API_KEY_PRIVATE }}
          NODE_ENV: production
        timeout-minutes: 20  # Conservative timeout for cleanup operation

