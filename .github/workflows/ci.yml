name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-ci-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-ci-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint, imports, typecheck
        run: bun run check
        env:
          # check-imports may read env; provide safe defaults so CI does not need secrets
          NODE_ENV: test
      - name: Unit & integration tests
        run: bun test
        env:
          NODE_ENV: test
          # Cookie-baseline tests sign their own cookies; no real AUTH_SECRET needed
          AUTH_SECRET: ci-test-secret-not-for-production
          CRON_SECRET: ci-test-cron-secret
