name: Retry Pending Generations

on:
  schedule:
    - cron: '0 * * * *'   # Every hour
  workflow_dispatch:      # Allow manual triggering

jobs:
  retry-pending-generations:
    name: Retry Failed Page Generations
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup package manager
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10
          
      # Setup Node.js runtime with caching
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          
      # Get pnpm cache directory for optimization
      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: |
          echo "path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      # Cache pnpm packages to speed up future runs
      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
            
      # Install project dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
        
      # Build TypeScript to JavaScript
      - name: Build project
        run: pnpm build
        
      # Ensure compiled file exists before running
      - name: Verify build
        run: test -f dist/cron/retry-pending-generations.js
        
      # Execute retry pending generations cron job
      - name: Run retry pending generations job
        run: node dist/cron/retry-pending-generations.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_READ_URL: ${{ secrets.DATABASE_READ_URL || secrets.DATABASE_URL }}
          NODE_ENV: production
          # AI provider credentials
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        timeout-minutes: 30  # Allow more time for AI generation retries
