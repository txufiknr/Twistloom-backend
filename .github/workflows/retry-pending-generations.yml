name: Actions Candidate Generations

on:
  schedule:
    - cron: '0 */12 * * *' # Every 12 hours
  workflow_dispatch:      # Allow manual triggering
    inputs:
      book_title:
        description: 'Title of the book to retry generation for'
        required: false
        type: string
      book_id:
        description: 'ID of the book to retry generation for'
        required: false
        type: string
      page_id:
        description: 'ID of the specific page to retry generation for'
        required: false
        type: string
      triggered_by:
        description: 'User ID who triggered the workflow'
        required: false
        type: string
      max_depth:
        description: 'Maximum depth to pre-generate candidates'
        required: false
        type: number

jobs:
  retry-pending-generations:
    # If input is provided, results in "Candidate Generations for {book_title}". Otherwise, results in "Routine Candidate Generations".
    name: ${{ inputs.book_title != '' && format('Candidate Generations for {0}', inputs.book_title) || 'Routine Candidate Generations' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup package manager
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10
          
      # Setup Node.js runtime with caching
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          
      # Get pnpm cache directory for optimization
      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: |
          echo "path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      # Cache pnpm packages to speed up future runs
      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
            
      # Install project dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
        env:
          CI: "" # .../node_modules/fasttext-ts postinstall: ⚠ Skipping model download (CI environment or --skip-download flag detected)
        
      # Build TypeScript to JavaScript
      - name: Build project
        run: pnpm build
        
      # Ensure compiled file exists before running
      - name: Verify build
        run: test -f dist/cron/retry-pending-generations.js
        
      # Execute retry pending generations cron job
      - name: Run retry pending generations job
        run: node dist/cron/retry-pending-generations.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_READ_URL: ${{ secrets.DATABASE_READ_URL || secrets.DATABASE_URL }}
          IMAGEKIT_API_KEY_PRIVATE: ${{ secrets.IMAGEKIT_API_KEY_PRIVATE }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          # AI provider credentials
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          # Workflow inputs (if triggered manually)
          TRIGGERED_BOOK_ID: ${{ github.event.inputs.book_id || '' }}
          TRIGGERED_PAGE_ID: ${{ github.event.inputs.page_id || '' }}
          TRIGGERED_BY_USER: ${{ github.event.inputs.triggered_by || '' }}
          TRIGGERED_MAX_DEPTH: ${{ github.event.inputs.max_depth || '' }}
          # GitHub token for next depth generations
          GITHUB_WORKFLOW_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
          SYSTEM_USER_ID: ${{ secrets.SYSTEM_USER_ID }}
          NODE_ENV: production
        timeout-minutes: 30  # Allow more time for AI generation retries
