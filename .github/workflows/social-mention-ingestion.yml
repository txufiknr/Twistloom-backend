name: Weekly Social Mention Ingestion

on:
  schedule:
    - cron: '0 6 * * 1'   # Weekly on Monday at 6 AM UTC
  workflow_dispatch:      # Allow manual triggering

jobs:
  social-mention-ingestion:
    name: Ingest Social Mentions
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Bun runtime
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Cache Bun packages to speed up future runs
      - name: Setup Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # Install project dependencies
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build TypeScript to JavaScript
      - name: Build project
        run: bun run build

      # Ensure compiled file exists before running
      - name: Verify build
        run: test -f dist/cron/social-mentions.js

      # Execute social mention ingestion cron job
      # Required secrets:
      #   DATABASE_URL          - Neon write connection (required)
      #   DATABASE_READ_URL     - Neon read replica (optional; falls back to DATABASE_URL)
      #   BRAVE_SEARCH_API_KEY  - optional; Brave Search skipped if absent
      # Note: SYSTEM_USER_ID / AUTH_SECRET are NOT needed here — the cron writes
      # via dbWrite and never calls requireAuth/requireSystemAdmin.
      - name: Run social-mentions job
        run: bun dist/cron/social-mentions.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_READ_URL: ${{ secrets.DATABASE_READ_URL || secrets.DATABASE_URL }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          NODE_ENV: production
        timeout-minutes: 15  # Conservative timeout for multi-source ingestion


