name: On-Demand Book Creation

on:
  schedule:
    # Run hourly to retry pending/failed book generations
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      book_id:
        description: 'Book ID (UUID v7)'
        required: false
        type: string

jobs:
  create-book:
    name: Create Book
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Bun runtime
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Cache Bun packages to speed up future runs
      - name: Setup Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # Install project dependencies
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        run: bun run build

      - name: Verify build
        run: test -f dist/cron/on-demand-book-creation.js

      - name: Run on-demand book creation
        run: bun dist/cron/on-demand-book-creation.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_READ_URL: ${{ secrets.DATABASE_READ_URL || secrets.DATABASE_URL }}
          IMAGEKIT_API_KEY_PRIVATE: ${{ secrets.IMAGEKIT_API_KEY_PRIVATE }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          # GitHub token for next depth generations
          GITHUB_WORKFLOW_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
          SYSTEM_USER_ID: ${{ secrets.SYSTEM_USER_ID }}
          NODE_ENV: production
          # AI provider credentials
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          # New AI provider credentials
          OVHCLOUD_API_KEY: ${{ secrets.OVHCLOUD_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          AIONLABS_API_KEY: ${{ secrets.AIONLABS_API_KEY }}
          CHUTES_API_KEY: ${{ secrets.CHUTES_API_KEY }}
          LLM7_API_KEY: ${{ secrets.LLM7_API_KEY }}
          INCEPTION_API_KEY: ${{ secrets.INCEPTION_API_KEY }}
          # Workflow input
          BOOK_ID: ${{ github.event.inputs.book_id }}
          # Optional backend webhook & internal secret for notifying completion/progress
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          WORKFLOW_WEBHOOK_URL: ${{ secrets.WORKFLOW_WEBHOOK_URL }}
          INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
        timeout-minutes: 45


